<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#091b33"/><rect x="108" y="92" width="1704" height="896" rx="28" fill="#efe4ce"/><rect x="108" y="92" width="24" height="896" fill="#b08a47"/>
  <text x="190" y="188" fill="#7b5c2e" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" letter-spacing="6">后世传世叙事 · 西汉</text>
  <text x="190" y="310" fill="#152f42" font-family="SimSun, serif" font-size="78" font-weight="700">《史记·商君列传》</text><line x1="192" y1="355" x2="1640" y2="355" stroke="#b08a47" stroke-width="3"/>
  <text x="195" y="455" fill="#243c4b" font-family="Microsoft YaHei, sans-serif" font-size="43">保存入秦、徙木立信与改革结局的重要叙事</text>
  <text x="195" y="525" fill="#243c4b" font-family="Microsoft YaHei, sans-serif" font-size="43">成书晚于变法二百多年，不是现场记录</text>
  <rect x="190" y="620" width="1500" height="170" rx="20" fill="#d8c5a0" opacity=".7"/>
  <text x="238" y="688" fill="#173849" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700">能支持：</text><text x="420" y="688" fill="#173849" font-family="Microsoft YaHei, sans-serif" font-size="36">后世怎样组织人物、改革与制度信用</text>
  <text x="238" y="750" fill="#8a3f2d" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700">不能直接证明：</text><text x="500" y="750" fill="#8a3f2d" font-family="Microsoft YaHei, sans-serif" font-size="36">逐字廷议、木头位置与现场对白</text>
  <text x="195" y="900" fill="#667781" font-family="Microsoft YaHei, sans-serif" font-size="29">材料真实 ≠ 能证明所有层面的历史细节</text>
</svg>
