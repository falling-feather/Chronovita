name: Secret history gate

on:
  pull_request:
  push:
    branches:
      - main
      - houduan
      - class
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_CONFIG_SHA256: "e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          config_url="https://raw.githubusercontent.com/gitleaks/gitleaks/v${GITLEAKS_VERSION}/config/gitleaks.toml"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "${release_url}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "${RUNNER_TEMP}/gitleaks.toml" \
            "${config_url}"
          printf '%s  %s\n' \
            "${GITLEAKS_ARCHIVE_SHA256}" \
            "${RUNNER_TEMP}/${archive}" \
            "${GITLEAKS_CONFIG_SHA256}" \
            "${RUNNER_TEMP}/gitleaks.toml" |
            sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" \
            -C "${RUNNER_TEMP}/gitleaks" \
            gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      - name: Scan complete Git history
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .gitleaks.toml || -L .gitleaks.toml ||
                -e .gitleaksignore || -L .gitleaksignore ]]; then
            echo "::error title=Untrusted Gitleaks override::Repository-level Gitleaks config and ignore files are forbidden."
            exit 1
          fi
          : > "${RUNNER_TEMP}/gitleaks-empty-ignore"
          gitleaks git \
            --config "${RUNNER_TEMP}/gitleaks.toml" \
            --gitleaks-ignore-path "${RUNNER_TEMP}/gitleaks-empty-ignore" \
            --ignore-gitleaks-allow \
            --redact=100 \
            --no-banner \
            --no-color \
            --timeout 120 \
            .
