name: Backend quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - houduan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python311-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHRONO_DISABLE_DOTENV: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install locked API dependencies
        run: python -m pip install --disable-pip-version-check -r apps/api/requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile backend sources
        run: python -m compileall -q apps services scripts tests

      - name: Validate canonical project documents
        run: python scripts/check_project_docs.py

      - name: Run backend test suite
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee backend-tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Backend test suite"
            echo
            echo '```text'
            tail -n 160 backend-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$test_status" -ne 0 ]]; then
            python -c "from pathlib import Path; text='\n'.join(Path('backend-tests.log').read_text(encoding='utf-8', errors='replace').splitlines()[-120:]); print('::error title=Backend test suite failed::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          fi
          exit "$test_status"
