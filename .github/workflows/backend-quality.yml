name: Backend quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - houduan
      - class
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python311-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHRONO_DISABLE_DOTENV: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Test and build authenticated web workspace
        working-directory: apps/web
        run: |
          npm test
          npm run build
          npm audit --audit-level=moderate

      - name: Install pinned API dependencies
        run: python -m pip install --disable-pip-version-check -r apps/api/requirements.txt

      - name: Install dependency auditor
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit known dependency vulnerabilities
        run: python scripts/audit_python_dependencies.py

      - name: Compile backend sources
        run: python -m compileall -q apps services scripts tests

      - name: Install pinned actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_ARCHIVE_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          release_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "${release_url}"
          printf '%s  %s\n' \
            "${ACTIONLINT_ARCHIVE_SHA256}" \
            "${RUNNER_TEMP}/${archive}" |
            sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${RUNNER_TEMP}/${archive}" \
            -C "${RUNNER_TEMP}/actionlint" \
            actionlint

      - name: Validate GitHub Actions workflows
        run: |
          "${RUNNER_TEMP}/actionlint/actionlint" -color=false

      - name: Validate canonical project documents
        run: python scripts/check_project_docs.py

      - name: Run backend test suite
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee backend-tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Backend test suite"
            echo
            echo '```text'
            tail -n 160 backend-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$test_status" -ne 0 ]]; then
            python -c "from pathlib import Path; text='\n'.join(Path('backend-tests.log').read_text(encoding='utf-8', errors='replace').splitlines()[-120:]); print('::error title=Backend test suite failed::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          fi
          exit "$test_status"
