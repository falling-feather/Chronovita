name: Windows classroom package

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.10.*"

permissions:
  contents: read

concurrency:
  group: classroom-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked build dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check `
            --require-hashes `
            -r apps/api/requirements.lock
          npm --prefix apps/web ci

      - name: Test and prebuild classroom web app
        shell: powershell
        run: |
          python -m unittest `
            tests.test_classroom_static `
            tests.test_classroom_initialization `
            tests.test_classroom_launcher `
            tests.test_classroom_release `
            -v
          npm --prefix apps/web test
          npm --prefix apps/web run build

      - name: Download verified offline runtime resources
        shell: powershell
        run: |
          $wheelhouse = "distribution\wheelhouse\windows-py311"
          New-Item -ItemType Directory -Path $wheelhouse -Force | Out-Null
          python -m pip download `
            --disable-pip-version-check `
            --require-hashes `
            --only-binary=:all: `
            --dest $wheelhouse `
            -r apps/api/requirements.lock
          python scripts/prepare_rag_model.py `
            --target distribution/models/BAAI-bge-small-zh-v1.5
          python scripts/prepare_rag_model.py `
            --verify-only `
            --target distribution/models/BAAI-bge-small-zh-v1.5

      - name: Build and verify deterministic classroom archive
        shell: powershell
        run: |
          $version = python -c "from services.version import APP_VERSION; print(APP_VERSION)"
          $sourceCommit = git rev-parse HEAD
          $output = Join-Path $env:RUNNER_TEMP "classroom-release"
          python scripts/build_classroom_release.py build `
            --source-root . `
            --output-dir $output `
            --version $version `
            --commit $sourceCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = @(
            Get-ChildItem -LiteralPath $output -Filter "*-windows.zip"
          )
          if ($archive.Count -ne 1) {
            throw "Expected exactly one Windows classroom archive."
          }
          python scripts/build_classroom_release.py verify `
            --archive $archive[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CLASSROOM_VERSION=$version" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CLASSROOM_OUTPUT=$output" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CLASSROOM_ARCHIVE=$($archive[0].FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cold-start extracted package from bundled wheelhouse
        shell: powershell
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "classroom-extracted"
          Expand-Archive -LiteralPath $env:CLASSROOM_ARCHIVE -DestinationPath $extract
          $roots = @(Get-ChildItem -LiteralPath $extract -Directory)
          if ($roots.Count -ne 1) {
            throw "Extracted classroom package root is invalid."
          }
          $packageRoot = $roots[0].FullName
          $bootstrapPassword = `
            "CI classroom admin $([guid]::NewGuid().ToString('N'))"
          $env:CHRONO_CLASSROOM_ADMIN_PASSWORD = $bootstrapPassword
          & (Join-Path $packageRoot "scripts\classroom.ps1") `
            -Port 8765 `
            -SkipBrowser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $health = Invoke-RestMethod `
            -Method Get `
            -Uri "http://127.0.0.1:8765/healthz" `
            -TimeoutSec 5
          $loginPage = Invoke-WebRequest `
            -UseBasicParsing `
            -Method Get `
            -Uri "http://127.0.0.1:8765/login" `
            -TimeoutSec 5
          if (
            $health.status -ne "alive" `
            -or $loginPage.StatusCode -ne 200 `
            -or $loginPage.Content -notmatch "Chronovita"
          ) {
            throw "Single-port classroom shell did not become healthy."
          }
          $session = Invoke-RestMethod `
            -Method Post `
            -Uri "http://127.0.0.1:8765/api/v1/auth/token" `
            -ContentType "application/json" `
            -Body (@{
              username = "admin"
              password = $bootstrapPassword
            } | ConvertTo-Json)
          if ($session.principal.roles -notcontains "admin") {
            throw "First administrator could not sign in."
          }
          $database = Join-Path $packageRoot "data\classroom\chronovita.db"
          if (-not (Test-Path -LiteralPath $database -PathType Leaf)) {
            throw "First launch did not create the local classroom database."
          }

      - name: Stop extracted classroom
        if: always()
        shell: powershell
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "classroom-extracted"
          $roots = @(Get-ChildItem -LiteralPath $extract -Directory -ErrorAction SilentlyContinue)
          if ($roots.Count -eq 1) {
            & (Join-Path $roots[0].FullName "scripts\stop-classroom.ps1") `
              -Port 8765
          }
          $owners = @(
            Get-NetTCPConnection `
              -State Listen `
              -LocalPort 8765 `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty OwningProcess -Unique
          )
          foreach ($owner in $owners) {
            if ($owner -gt 0) {
              & taskkill.exe /PID "$owner" /T /F 2>$null | Out-Null
            }
          }

      - name: Upload classroom archive and inventories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Chronovita-Classroom-v${{ env.CLASSROOM_VERSION }}-windows
          path: |
            ${{ env.CLASSROOM_OUTPUT }}/*-windows.zip
            ${{ env.CLASSROOM_OUTPUT }}/*-windows.zip.sha256
            ${{ env.CLASSROOM_OUTPUT }}/*-licenses.json
          if-no-files-found: error
          retention-days: 30
