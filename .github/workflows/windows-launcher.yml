name: Windows launcher gate

on:
  pull_request:
  push:
    branches:
      - main
      - houduan
      - class
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teacher-editor-launcher:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate launcher sources
        shell: powershell
        run: |
          foreach ($scriptFile in @(
            "scripts\teacher-editor.ps1",
            "scripts\stop-teacher-editor.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $scriptFile),
              [ref] $tokens,
              [ref] $parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell launcher parsing failed: $scriptFile"
            }
          }

          $expectedRootCommands = @(
            "点我一键启动（部署）.cmd",
            "点我一键关闭.cmd"
          )
          $rootCommands = @(
            Get-ChildItem -LiteralPath "." -File -Filter "*.cmd"
          )
          $rootCommandNames = @($rootCommands | ForEach-Object { $_.Name })
          $missingRootCommands = @(
            $expectedRootCommands |
              Where-Object { $_ -notin $rootCommandNames }
          )
          $unexpectedRootCommands = @(
            $rootCommandNames |
              Where-Object { $_ -notin $expectedRootCommands }
          )
          if (
            $missingRootCommands.Count -ne 0 `
            -or $unexpectedRootCommands.Count -ne 0
          ) {
            throw "Expected the named teacher-facing start and stop CMD files at the repository root."
          }
          $cmdFiles = @(
            (Resolve-Path "点我一键启动（部署）.cmd").Path,
            (Resolve-Path "点我一键关闭.cmd").Path,
            (Resolve-Path "scripts\teacher-editor.cmd").Path,
            (Resolve-Path "scripts\stop-teacher-editor.cmd").Path
          )
          foreach ($cmdFile in $cmdFiles) {
            $nonAscii = [System.IO.File]::ReadAllBytes(
              (Resolve-Path $cmdFile)
            ) | Where-Object { $_ -gt 127 } | Select-Object -First 1
            if ($null -ne $nonAscii) {
              throw "$cmdFile must keep ASCII-only contents for cmd.exe."
            }
          }

      - name: Start through the teacher-facing launcher
        shell: powershell
        run: |
          & (Resolve-Path "点我一键启动（部署）.cmd").Path -SkipBrowser
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify API and rendered editor
        shell: powershell
        run: |
          $ready = Invoke-RestMethod `
            -Method Get `
            -Uri "http://127.0.0.1:8000/readyz" `
            -TimeoutSec 5
          if ($ready.status -ne "ready") {
            throw "API readiness response was not ready."
          }

          $editor = Invoke-WebRequest `
            -UseBasicParsing `
            -Method Get `
            -Uri "http://127.0.0.1:5173/admin/content" `
            -TimeoutSec 5
          if (
            $editor.StatusCode -ne 200 `
            -or $editor.Content -notmatch "Chronovita"
          ) {
            throw "Teacher editor HTTP service did not return the expected shell."
          }

          $browserCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} "Microsoft\Edge\Application\msedge.exe"),
            (Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application\chrome.exe")
          )
          $browser = $browserCandidates |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $browser) {
            throw "No supported Edge or Chrome executable was found."
          }

          $profile = Join-Path $env:RUNNER_TEMP "chronovita-browser-profile"
          $renderedPath = Join-Path $env:RUNNER_TEMP "chronovita-rendered-editor.html"
          $browserErrors = Join-Path $env:RUNNER_TEMP "chronovita-browser-errors.log"
          $browserProcess = Start-Process `
            -FilePath $browser `
            -ArgumentList @(
              "--headless=new",
              "--disable-gpu",
              "--no-first-run",
              "--no-default-browser-check",
              "--user-data-dir=$profile",
              "--virtual-time-budget=30000",
              "--dump-dom",
              "http://127.0.0.1:5173/admin/content"
            ) `
            -Wait `
            -PassThru `
            -WindowStyle Hidden `
            -RedirectStandardOutput $renderedPath `
            -RedirectStandardError $browserErrors
          if ($browserProcess.ExitCode -ne 0) {
            Get-Content -LiteralPath $browserErrors -ErrorAction SilentlyContinue
            throw "Headless browser could not render the teacher editor."
          }
          $renderedDom = Get-Content -LiteralPath $renderedPath -Raw
          if ($renderedDom -notmatch 'data-testid="admin-content-editor"') {
            Get-Content -LiteralPath $browserErrors -ErrorAction SilentlyContinue
            throw "React did not render the teacher editor route."
          }

      - name: Check launcher does not modify tracked source
        shell: powershell
        run: git diff --exit-code

      - name: Stop through the teacher-facing closer
        shell: powershell
        run: |
          & (Resolve-Path "点我一键关闭.cmd").Path
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Start-Sleep -Seconds 1
          $remaining = @(
            8000, 5173 |
              ForEach-Object {
                Get-NetTCPConnection `
                  -State Listen `
                  -LocalPort $_ `
                  -ErrorAction SilentlyContinue
              }
          )
          if ($remaining.Count -ne 0) {
            throw "Teacher-facing closer left editor ports active."
          }

      - name: Show launcher logs on failure
        if: failure()
        shell: powershell
        run: |
          Get-ChildItem ".teacher-editor-logs" -Filter "*.log" `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "== $($_.Name) =="
              Get-Content -LiteralPath $_.FullName -Tail 100
            }

      - name: Stop launcher process trees
        if: always()
        shell: powershell
        run: |
          $processIds = @(
            8000, 5173 |
              ForEach-Object {
                Get-NetTCPConnection `
                  -State Listen `
                  -LocalPort $_ `
                  -ErrorAction SilentlyContinue
              } |
              Select-Object -ExpandProperty OwningProcess -Unique
          )
          foreach ($processId in $processIds) {
            if ($processId -gt 0) {
              & taskkill.exe /PID "$processId" /T /F 2>$null | Out-Null
            }
          }
          Start-Sleep -Seconds 2
          $remaining = @(
            8000, 5173 |
              ForEach-Object {
                Get-NetTCPConnection `
                  -State Listen `
                  -LocalPort $_ `
                  -ErrorAction SilentlyContinue
              }
          )
          if ($remaining.Count -ne 0) {
            throw "Launcher ports are still in use after cleanup."
          }
