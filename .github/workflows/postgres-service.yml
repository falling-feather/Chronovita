name: PostgreSQL service gate

on:
  pull_request:
  push:
    branches:
      - main
      - houduan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres16-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14-alpine3.24
        env:
          POSTGRES_USER: chronovita_test
          POSTGRES_PASSWORD: chronovita_test_only
          POSTGRES_DB: chronovita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronovita_test -d chronovita_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CHRONO_TEST_POSTGRES_URL: postgresql+psycopg://chronovita_test:chronovita_test_only@127.0.0.1:5432/chronovita_test
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        run: python -m pip install --disable-pip-version-check -r apps/api/requirements.txt

      - name: Run PostgreSQL 16 service matrix
        run: python -m unittest tests.test_postgres_service -v
