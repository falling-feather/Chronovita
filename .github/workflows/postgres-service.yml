name: PostgreSQL service gate

on:
  pull_request:
  push:
    branches:
      - main
      - houduan
      - class
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres16-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14-alpine3.24
        env:
          POSTGRES_USER: chronovita_test_admin
          POSTGRES_PASSWORD: chronovita_test_admin_only
          POSTGRES_DB: chronovita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronovita_test_admin -d chronovita_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        run: python -m pip install --disable-pip-version-check -r apps/api/requirements.txt

      - name: Provision isolated PostgreSQL roles
        env:
          CHRONO_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://chronovita_test_admin:chronovita_test_admin_only@127.0.0.1:5432/chronovita_test
        run: python scripts/provision_postgres_test.py --github-env

      - name: Run PostgreSQL 16 service matrix
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_postgres_service -v 2>&1 | tee postgres-service.log
          test_status=${PIPESTATUS[0]}
          set -e
          {
            echo "### PostgreSQL service matrix"
            echo
            echo '```text'
            tail -n 160 postgres-service.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$test_status" -ne 0 ]]; then
            python -c "from pathlib import Path; text='\n'.join(Path('postgres-service.log').read_text(encoding='utf-8', errors='replace').splitlines()[-120:]); print('::error title=PostgreSQL service matrix failed::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          fi
          exit "$test_status"
