name: Student classroom E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-classroom-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  student-classroom-e2e:
    name: student-classroom-e2e
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI: "true"
      CHRONO_DISABLE_DOTENV: "true"
      CHRONO_RUNTIME_PROFILE: local
      CHRONO_API_WORKER_COUNT: "1"
      CHRONO_DEBUG: "false"
      CHRONO_AUTH_MODE: accounts
      CHRONO_AUTH_COOKIE_SECURE: "false"
      CHRONO_AUTH_BOOTSTRAP_USERNAME: classroom.admin
      CHRONO_AUTH_BOOTSTRAP_DISPLAY_NAME: Classroom E2E Admin
      CHRONO_AUTH_LOGIN_RATE_LIMIT_ATTEMPTS: "100"
      CHRONO_GITHUB_PUBLICATION_ENABLED: "false"
      CHRONO_RAG_VECTOR_ENABLED: "false"
      CHRONO_LLM_PROVIDER: mock
      CHRONO_SERVE_WEB_APP: "true"
      CHRONO_E2E_ADMIN_USERNAME: classroom.admin
      CHRONO_E2E_BASE_URL: http://127.0.0.1:8765
      CHRONO_E2E_BROWSER_CHANNEL: msedge

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked test dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check `
            --require-hashes `
            -r apps/api/requirements.lock
          npm --prefix apps/web ci

      - name: Recheck flagship contracts, RAG benchmark and package boundaries
        shell: powershell
        run: |
          python -m unittest `
            tests.test_dayu_flagship_content `
            tests.test_shangyang_flagship_content `
            tests.test_flagship_media_release `
            tests.test_rag_retrieval `
            tests.test_rag_service `
            tests.test_rag_api `
            tests.test_llm_adapter `
            tests.test_game_action_classifier `
            tests.test_game_narrator `
            tests.test_auth_api `
            tests.test_content_rbac_api `
            tests.test_student_resource_ownership_api `
            tests.test_classroom_static `
            tests.test_classroom_initialization `
            tests.test_classroom_launcher `
            tests.test_classroom_release `
            -v

      - name: Build same-origin classroom web app
        shell: powershell
        run: |
          npm --prefix apps/web test
          npm --prefix apps/web run build

      - name: Configure isolated classroom accounts and storage
        shell: powershell
        run: |
          $database = Join-Path $env:RUNNER_TEMP "chronovita-student-e2e.db"
          $ragIndex = Join-Path $env:RUNNER_TEMP "chronovita-student-rag.db"
          $missingModel = Join-Path $env:RUNNER_TEMP "intentionally-missing-bge"
          $contentRoot = (Resolve-Path "content").Path
          $webRoot = (Resolve-Path "apps\web\dist").Path
          $pythonPath = "$env:GITHUB_WORKSPACE;$env:GITHUB_WORKSPACE\apps\api"

          "CHRONO_SQLITE_PATH=$database" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHRONO_RAG_INDEX_PATH=$ragIndex" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHRONO_RAG_MODEL_ROOT=$missingModel" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHRONO_CONTENT_ROOT=$contentRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHRONO_WEB_DIST_ROOT=$webRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHRONO_CORS_ORIGINS=[`"http://127.0.0.1:8765`",`"http://localhost:8765`"]" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHRONO_TRUSTED_HOSTS=[`"127.0.0.1`",`"localhost`"]" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$pythonPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run isolated single-port classroom browser chain
        shell: powershell
        run: |
          $adminPassword = "CI-admin-$([guid]::NewGuid().ToString('N'))-Aa1!"
          $userPassword = "CI-student-$([guid]::NewGuid().ToString('N'))-Bb2!"
          Write-Output "::add-mask::$adminPassword"
          Write-Output "::add-mask::$userPassword"
          $env:CHRONO_AUTH_BOOTSTRAP_PASSWORD = $adminPassword
          $env:CHRONO_E2E_ADMIN_PASSWORD = $adminPassword
          $env:CHRONO_E2E_USER_PASSWORD = $userPassword

          $stdout = Join-Path $env:RUNNER_TEMP "chronovita-e2e-api.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "chronovita-e2e-api.stderr.log"
          $python = (Get-Command python).Source
          $server = Start-Process `
            -FilePath $python `
            -ArgumentList @(
              "-m", "uvicorn", "main:app",
              "--app-dir", "apps/api",
              "--host", "127.0.0.1",
              "--port", "8765",
              "--workers", "1"
            ) `
            -PassThru `
            -WindowStyle Hidden `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          "CHRONO_E2E_SERVER_PID=$($server.Id)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $healthy = $false
          foreach ($attempt in 1..60) {
            if ($server.HasExited) {
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
              throw "Classroom service exited before becoming healthy."
            }
            try {
              $health = Invoke-RestMethod `
                -Method Get `
                -Uri "http://127.0.0.1:8765/healthz" `
                -TimeoutSec 3
              $login = Invoke-WebRequest `
                -UseBasicParsing `
                -Method Get `
                -Uri "http://127.0.0.1:8765/login" `
                -TimeoutSec 3
              if (
                $health.status -eq "alive" `
                -and $login.StatusCode -eq 200 `
                -and $login.Content -match "Chronovita"
              ) {
                $healthy = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $healthy) {
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
            throw "Classroom service did not become healthy."
          }
          $env:CHRONO_AUTH_BOOTSTRAP_PASSWORD = $null
          & npm.cmd --prefix apps/web run test:e2e
          if ($LASTEXITCODE -ne 0) {
            throw "Student classroom Playwright chain failed with $LASTEXITCODE."
          }

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: student-classroom-e2e-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/chronovita-e2e-api.stdout.log
            ${{ runner.temp }}/chronovita-e2e-api.stderr.log

      - name: Stop isolated classroom
        if: always()
        shell: powershell
        run: |
          $processIds = @(
            Get-NetTCPConnection `
              -State Listen `
              -LocalPort 8765 `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty OwningProcess -Unique
          )
          if ($env:CHRONO_E2E_SERVER_PID) {
            $processIds += [int]$env:CHRONO_E2E_SERVER_PID
          }
          foreach ($processId in @($processIds | Sort-Object -Unique)) {
            if ($processId -gt 0 -and (Get-Process -Id $processId -ErrorAction SilentlyContinue)) {
              & taskkill.exe /PID "$processId" /T /F 2>$null | Out-Null
            }
          }
          Start-Sleep -Seconds 2
          if (Get-NetTCPConnection -State Listen -LocalPort 8765 -ErrorAction SilentlyContinue) {
            throw "Student classroom E2E left port 8765 active."
          }
